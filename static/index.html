<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>switch-sim</title>
		<link rel="stylesheet" href="./css/styles.css" />
		<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<script type="module" src="./js/app.js"></script>
		<!-- For Markdown -->
		<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
	</head>

	<body>
		<!-- Port dialog -->
		<dialog id="port-dialog" class="dialog-small">
			<form method="dialog" id="port-form">
				<div class="dialog-header">
					<h2>Add Port</h2>
				</div>

				<div class="dialog-content">
					<label>
						Name
						<input
							id="port-name"
							type="text"
							autocomplete="off"
						/>
					</label>

					<fieldset>
						<legend>Direction</legend>

						<label>
							<input
								type="radio"
								name="direction"
								value="input"
								checked
							/>
							Input
						</label>

						<label>
							<input
								type="radio"
								name="direction"
								value="output"
							/>
							Output
						</label>
					</fieldset>
				</div>

				<div class="dialog-footer">
					<button type="submit" value="cancel">Cancel</button>
					<button type="submit" value="confirm">Add</button>
				</div>
			</form>
		</dialog>

		<!-- Examples dialog -->
		<dialog id="examples-dialog" class="dialog-large">
			<form method="dialog" id="example-form">
				<div class="examples-layout">
					<aside class="examples-sidebar">
						<div class="dialog-header">
							<h2>Examples</h2>
						</div>

						<div class="examples-list" id="examples-list">
						</div>
					</aside>

					<section class="examples-preview" id="examples-preview">
						<img
							class="examples-image"
							id="examples-image"
							alt="Circuit preview"
							hidden
						/>
						<div class="examples-description" id="examples-description">
						</div>
					</section>
				</div>

				<div class="dialog-footer">
					<button type="submit" value="cancel">Cancel</button>
					<button type="submit" value="confirm">Open</button>
				</div>
			</form>
		</dialog>

		<!-- Application -->
		<div class="app">
			<header class="toolbar">
				<input id="open-file" type="file" accept=".json" hidden />

				<div class="logo">switch-sim</div>

				<div class="toolbar-group">
					<button id="new-button">New</button>
					<button id="open-button">Open</button>
					<button id="save-button">Save</button>
				</div>

				<div class="toolbar-group">
					<button id="example-button">💡 Examples</button>
				</div>

				<div class="toolbar-spacer"></div>

				<div class="toolbar-group">
					<button class="start-button" id="start-button">
						<span class="started">■</span>
						<span class="stopped">▶</span>
					</button>

					<button class="theme-button" id="theme-button">
						<span class="sun">☀️</span>
						<span class="moon">🌙</span>
					</button>
				</div>
			</header>

			<main class="workspace">
				<aside class="sidebar">
					<h2>Tools</h2>
					<div class="palette" id="tool-palette"></div>

					<h2>Components</h2>
					<div class="palette" id="component-palette"></div>

					<h2>Library</h2>
					<div class="palette" id="library-palette"></div>
				</aside>

				<section class="editor">
					<div class="canvas">
						<svg
							viewBox="0 0 100 60"
							class="circuit-svg"
							id="circuit-svg"
						></svg>
					</div>

					<div class="editor-hierarchy">
						<p class="editor-tool" id="editor-hierarchy"></p>
					</div>

					<div class="editor-stats">
						<p class="editor-tool" id="editor-tool"></p>
						<p class="editor-component" id="editor-component"></p>
					</div>
				</section>
			</main>
		</div>
	</body>
</html>
